<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"><meta name="theme-color" content="#07111b">
<title>東鐵綫｜旺角東司機室</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07111b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden}main{width:100%;height:100%;height:100dvh;display:grid;place-items:center;position:relative}img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}button{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);right:calc(env(safe-area-inset-right) + 14px);border:1px solid #ffffff55;border-radius:10px;background:#081727c9;color:white;padding:10px 14px;font:600 13px inherit;cursor:pointer;backdrop-filter:blur(8px)}button:focus-visible{outline:2px solid #9dd9ff}button[hidden]{display:none}@media(orientation:portrait){img{width:100%;height:auto}}@media(orientation:landscape){img{height:100%;width:auto}}@media(display-mode:fullscreen){button{opacity:.55}}@media(hover:hover){button:hover{background:#1b344c}}
</style></head>
<body><main><img src="cab-scene.png" alt="香港東鐵綫旺角東司機室寫實概念畫面，包含列車儀表板、路軌及車站景觀"><button id="full" type="button" aria-label="切換全屏">全屏觀看 ⛶</button></main>
<script>const b=document.getElementById('full');if(!document.fullscreenEnabled)b.hidden=true;b.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('此瀏覽器未能啟用全屏，請將手機橫向觀看。')}});document.addEventListener('fullscreenchange',()=>{b.textContent=document.fullscreenElement?'退出全屏':'全屏觀看 ⛶'});</script></body></html>
