:10px;max-width:240px}}</style></head><body><div id="hud"><div id="top"><span>東鐵綫 · 旺角東場景概念驗證</span><span id="station">下一站：旺角東</span></div><div id="note">V0.2：三路軌及車站結構概念版，並非真實測量模型。停在 125m 附近可開門。拖動畫面可左右望；鍵盤 W/S 或 ↑/↓ 操作。</div><div id="message"></div><div id="landscape">請將手機橫向使用，以獲得完整駕駛視野</div><div id="bottom"><div class="readout"><div class="muted">速度</div><span class="speed" id="speed">0</span><span class="muted"> km/h</span></div><button id="brake">煞車</button><div style="flex:1;min-width:90px"><div class="muted">動力控制 <span id="powerText">0%</span></div><input id="throttle" aria-label="動力" type="range" min="0" max="100" value="0" style="width:100%"></div><button id="doors" disabled>開門</button><button id="reset">重置</button><button id="fullscreen">全屏</button></div></div><script type="module">

let pos=0,speed=0,power=0,braking=false,yaw=0,pitch=0,doorsOpen=false,completed=false;let pointer=null;const msg=document.getElementById('message'),doorButton=document.getElementById('doors');doorButton.onclick=()=>{if(speed>0.5||Math.abs(pos-125)>16)return;doorsOpen=!doorsOpen;doorButton.textContent=doorsOpen?'關門':'開門';msg.textContent=doorsOpen?'旺角東站：車門已開啟，請關門後繼續':'車門已關閉，可以繼續行車';if(doorsOpen){power=0;slider.value=0;document.getElementById('powerText').textContent='0%';completed=true}};const slider=document.getElementById('throttle');slider.addEventListener('input',()=>{power=+slider.value;document.getElementById('powerText').textContent=power+'%'});const brake=document.getElementById('brake');for(let ev of ['pointerdown','touchstart'])brake.addEventListener(ev,e=>{braking=true;power=0;slider.value=0;document.getElementById('powerText').textContent='0%';e.preventDefault()},{passive:false});for(let ev of ['pointerup','pointercancel','touchend','touchcancel'])window.addEventListener(ev,()=>braking=false);document.getElementById('reset').onclick=()=>{pos=0;speed=0;power=0;doorsOpen=false;completed=false;doorButton.textContent="開門";msg.textContent="";slider.value=0;document.getElementById('powerText').textContent='0%';yaw=0;pitch=0};document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};window.addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key)){power=Math.min(100,power+10);slider.value=power;document.getElementById('powerText').textContent=power+'%'}if(['ArrowDown','s','S',' '].includes(e.key)){braking=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(['ArrowDown','s','S',' '].includes(e.key))braking=false});renderer.domElement.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer)return;yaw=Math.max(-.8,Math.min(.8,yaw-(e.clientX-pointer.x)*.003));pitch=Math.max(-.28,Math.min(.28,pitch-(e.clientY-pointer.y)*.002));pointer={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>pointer=null);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);let accel=(doorsOpen?0:power/100*.78)-(braking?2.6:0)-.12;if(speed<=0&&accel<0)accel=0;speed=Math.max(0,Math.min(80,speed+accel*dt*3.6));pos+=speed/3.6*dt;camera.position.set(0,2.85,-pos+6);camera.rotation.set(pitch,yaw,0,'YXZ');document.getElementById('speed').textContent=Math.round(speed);doorButton.disabled=!(speed<.5&&Math.abs(pos-125)<16);if(!completed&&pos>148&&speed>1)msg.textContent='已駛過停車位置！請重置再試';else if(!completed&&pos>90&&pos<125&&speed>28)msg.textContent='注意：接近月台，請及早煞車';else if(!completed&&pos<90)msg.textContent='';document.getElementById('station').textContent=pos<125?'下一站：旺角東 · '+Math.max(0,Math.round(125-pos))+' m':completed?'旺角東：已完成停站':'旺角東：停車位置已過';if(pos>445){pos=0;speed=0;power=0;doorsOpen=false;completed=false;doorButton.textContent="開門";msg.textContent="";slider.value=0;document.getElementById('powerText').textContent='0%'}renderer.render(scene,camera)}animate();
